name: sync-r2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag that holds the archive of record
        default: data-v1
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download the release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --dir release-assets --repo "${{ github.repository }}"
      - name: Install the AWS CLI
        run: python -m pip install awscli
      - name: Mirror the release to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync release-assets "s3://${{ secrets.R2_BUCKET }}/" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "*.ktx2" --include "*.webp" --include "*.png" --include "*.webm" --include "*.mp4" --include "*.json" --include "*.bin"
