[project]
name = "earth-pipeline"
version = "0.1.0"
description = "Earth Listens data pipeline. SAMPLE fixtures only; do not fetch live data from this package's tests."
requires-python = ">=3.12"
dependencies = ["jsonschema==4.23.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earth_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
